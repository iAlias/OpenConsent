name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build SDK bundles
        run: npm run build

      - name: Ensure the committed CDN bundles are up to date
        run: |
          stale=""
          for f in dist/openconsent.min.js dist/cmp.min.js; do
            if ! git diff --quiet -- "$f"; then
              echo "::error::$f is out of date. Run 'npm run build' and commit it."
              git --no-pager diff --stat -- "$f"
              stale="yes"
            fi
          done
          [ -z "$stale" ] || exit 1
          echo "Bundles are in sync with src/"

      - name: Verify the package builds and packs cleanly
        run: npm pack --dry-run
